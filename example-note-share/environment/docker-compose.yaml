services:
  # Neither service declares networks or network_mode, so Harbor gives them one shared localhost,
  # and the model reaches the target at http://localhost:8080.
  main:
    depends_on:
      target:
        condition: service_healthy
  target:
    build: ./target
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 2s
      retries: 15

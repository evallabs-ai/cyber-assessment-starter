services:
  main:
    # On the portal each container has its own localhost, so main shares target's to reach it.
    network_mode: "service:target"
    depends_on:
      target:
        condition: service_healthy
  target:
    build: ./target
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 2s
      retries: 15
